<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>
<input id="username" placeholder="Your name">
<button onclick="connect()">Join</button>
<div id="messages"></div>
<input id="msg" placeholder="Message">
<button onclick="send()">Send</button>

<script>
    let client;

    function connect() {
        const name = document.getElementById('username').value;
        client = new StompJs.Client({
            brokerURL: 'ws://localhost:8080/ws',
            connectHeaders: {
                Authorization: 'token-' + name
            },
            heartbeatIncoming: 1000,
            heartbeatOutgoing: 1000,
        });

        client.debug = (str) => console.log('STOMP:',str);
        client.onConnect = () => {
            client.subscribe('/topic/public', (frame) => {
                const m = JSON.parse(frame.body);
                const line = m.type === 'CHAT'
                    ? m.sender + ': ' + m.content
                    : m.sender + ' ' + (m.type === 'JOIN' ? 'joined' : 'left');
                document.getElementById('messages').innerHTML += line + '<br>';
            });

            client.publish({
                destination: '/app/chat.join',
                body: JSON.stringify({ type: 'JOIN', sender: name })
            });
        };

        client.onStompError = (frame) => {
            console.log('Rejected:', frame.headers['message']);
            document.getElementById('messages').innerHTML += 'Connection refused: invalid token<br>';
            client.deactivate();
        }

        client.activate();
    }

    function send() {
        client.publish({
            destination: '/app/chat.send',
            body: JSON.stringify({
                type: 'CHAT',
                sender: document.getElementById('username').value,
                content: document.getElementById('msg').value
            })
        });
    }

    function joinRoom (room)
    {
        client.subscribe('/topic/room' + room, (frame) => {
            const m = JSON.parse(frame.body);
            document.getElementById('messages').innerHTML += ' [ ' + room + ' ] ' + m.sender + ' : ' + m.content + '<br/>';
        })
    }

    function sendToRoom (room, text)
    {
        client.publish({
            destination: '/app/chat.room' + room,
            body: JSON.stringify({ content: text})
        })
    }

</script>
</body>
</html>
